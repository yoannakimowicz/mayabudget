<title>Budget Maya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eaf4fc;
    --surface:#ffffff;
    --surface-soft:#f2f9fd;
    --border:#d9e9f6;
    --text:#17293b;
    --text-soft:#5c7288;
    --text-faint:#93a8bb;
    --primary:#2f7fc4;
    --primary-dark:#215f97;
    --primary-darker:#173f66;
    --primary-soft:#d8ecfb;
    --primary-softer:#eef7fd;
    --pink:#ef6f9b;
    --pink-soft:#fde5ed;
    --danger:#e2685c;
    --danger-soft:#fbe6e3;
    --success:#2ea36f;
    --success-soft:#dff5e9;
    --virement-1:#7fc4f6;
    --virement-2:#2f7fc4;
    --shadow:0 10px 26px -14px rgba(23,64,101,.35);
    --radius-lg:22px;
    --radius-md:16px;
    --radius-sm:11px;
    --font-display:'Baloo 2', system-ui, sans-serif;
    --font-body:'Nunito', system-ui, sans-serif;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0e1c29;
      --surface:#15263a;
      --surface-soft:#1b3149;
      --border:#294763;
      --text:#eaf3fb;
      --text-soft:#a7c0d6;
      --text-faint:#7791a8;
      --primary:#6cabe6;
      --primary-dark:#8fc0ee;
      --primary-darker:#cfe6f9;
      --primary-soft:#213c56;
      --primary-softer:#182c40;
      --pink:#f28cae;
      --pink-soft:#3c2635;
      --danger:#ec8579;
      --danger-soft:#3b2320;
      --success:#69cf9c;
      --success-soft:#173a2b;
      --virement-1:#3f74a3;
      --virement-2:#193f63;
      --shadow:0 10px 26px -14px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0e1c29;
    --surface:#15263a;
    --surface-soft:#1b3149;
    --border:#294763;
    --text:#eaf3fb;
    --text-soft:#a7c0d6;
    --text-faint:#7791a8;
    --primary:#6cabe6;
    --primary-dark:#8fc0ee;
    --primary-darker:#cfe6f9;
    --primary-soft:#213c56;
    --primary-softer:#182c40;
    --pink:#f28cae;
    --pink-soft:#3c2635;
    --danger:#ec8579;
    --danger-soft:#3b2320;
    --success:#69cf9c;
    --success-soft:#173a2b;
    --virement-1:#3f74a3;
    --virement-2:#193f63;
    --shadow:0 10px 26px -14px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
  }
  .page{
    max-width:760px;
    margin:0 auto;
    padding:22px 16px 60px;
  }
  .app-header{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:18px;
  }
  .heart-badge{
    flex:none;
    width:52px;height:52px;
    border-radius:16px;
    background:linear-gradient(155deg,var(--pink-soft),var(--surface));
    border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;
    box-shadow:var(--shadow);
  }
  .heart-badge svg{width:26px;height:26px;color:var(--pink);}
  .app-header h1{
    font-family:var(--font-display);
    font-size:1.7rem;
    margin:0 0 2px;
    color:var(--primary-darker);
    letter-spacing:.2px;
  }
  .app-header .subtitle{
    margin:0;
    font-size:.92rem;
    color:var(--text-soft);
  }
  .sync-row{
    margin-left:auto;
    display:flex;
    align-items:center;
    gap:6px;
    font-size:.78rem;
    color:var(--text-faint);
    white-space:nowrap;
  }
  .sync-dot{width:7px;height:7px;border-radius:50%;background:var(--text-faint);flex:none;transition:background .2s;}
  .sync-dot.ok{background:var(--success);}
  .sync-dot.busy{background:var(--primary);}
  .sync-dot.err{background:var(--danger);}

  .tabs{
    display:flex;
    gap:8px;
    background:var(--surface-soft);
    border:1px solid var(--border);
    padding:6px;
    border-radius:999px;
    margin-bottom:20px;
  }
  .tab-btn{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    border:none;
    background:transparent;
    color:var(--text-soft);
    font-family:var(--font-body);
    font-weight:700;
    font-size:.88rem;
    padding:10px 8px;
    border-radius:999px;
    cursor:pointer;
    transition:background .15s,color .15s,box-shadow .15s;
  }
  .tab-btn svg{width:17px;height:17px;flex:none;}
  .tab-btn.active{
    background:var(--primary);
    color:#fff;
    box-shadow:var(--shadow);
  }
  .tab-btn:not(.active):hover{background:var(--primary-soft);}

  .tab-panel{display:flex;flex-direction:column;gap:18px;}
  .tab-panel[hidden]{display:none!important;}
  [hidden]:not([hidden="until-found"]){display:none!important;}

  h2.section-title{
    font-family:var(--font-display);
    font-size:1.2rem;
    margin:4px 0 0;
    color:var(--primary-darker);
  }
  .house-title-input{
    font-family:var(--font-body);
    font-weight:700;
    font-size:.92rem;
    color:var(--text-soft);
    border:1px dashed transparent;
    background:transparent;
    border-radius:8px;
    padding:2px 6px;
    margin:-2px 0 0 -6px;
    width:100%;
  }
  .house-title-input:hover,.house-title-input:focus{border-color:var(--border);outline:none;}

  .virement-card{
    background:linear-gradient(135deg,var(--virement-1),var(--virement-2));
    border-radius:var(--radius-lg);
    padding:12px 16px 13px;
    color:#fff;
    box-shadow:var(--shadow);
  }
  .virement-note{
    font-size:.74rem;
    line-height:1.3;
    color:#eafcff;
    margin:0 0 9px;
  }
  .virement-people{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
  }
  .virement-person{
    background:rgba(255,255,255,.16);
    border-radius:var(--radius-sm);
    padding:7px 12px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:8px;
  }
  .virement-person .who{
    font-size:.72rem;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.6px;
    color:#eafcff;
    flex:none;
  }
  .virement-person .amt{
    font-family:var(--font-display);
    font-size:1.05rem;
    font-variant-numeric:tabular-nums;
    text-align:right;
  }
  .virement-total{
    text-align:center;
    margin-top:8px;
    font-size:.85rem;
    color:#f2fdff;
  }
  .virement-total b{
    font-family:var(--font-display);
    font-size:.98rem;
    font-variant-numeric:tabular-nums;
    color:#fff;
  }

  .helper-note{
    font-size:.82rem;
    font-style:italic;
    color:var(--text-faint);
    margin:0;
  }

  .group{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .group-head{
    display:flex;
    align-items:baseline;
    gap:8px;
    flex-wrap:wrap;
  }
  .group-pill{
    font-family:var(--font-display);
    font-size:.85rem;
    font-weight:700;
    color:var(--primary-darker);
    background:var(--primary-soft);
    padding:4px 14px;
    border-radius:999px;
  }
  .group-desc{
    font-size:.78rem;
    color:var(--text-faint);
  }

  .row-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    padding:7px 10px 8px;
    box-shadow:var(--shadow);
  }
  .row-top{
    display:flex;
    align-items:center;
    gap:6px;
    margin-bottom:4px;
  }
  .row-label{
    flex:1;
    font-weight:700;
    font-size:.86rem;
    border:none;
    background:transparent;
    color:var(--text);
    font-family:var(--font-body);
    padding:1px 4px;
    border-radius:6px;
    min-width:0;
  }
  .row-label:hover,.row-label:focus{background:var(--surface-soft);outline:none;}
  .row-del{
    flex:none;
    width:20px;height:20px;
    border-radius:50%;
    border:none;
    background:var(--danger-soft);
    color:var(--danger);
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:transform .12s;
  }
  .row-del:hover{transform:scale(1.08);}
  .row-del svg{width:10px;height:10px;}

  .row-amounts{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px;
    margin-bottom:4px;
  }
  .row-amounts.single{grid-template-columns:1fr;}
  .amount-field{
    display:flex;
    align-items:center;
    gap:4px;
    background:var(--surface-soft);
    border:1px solid var(--border);
    border-radius:8px;
    padding:2px 7px;
  }
  .amount-field .who{
    font-size:.62rem;
    font-weight:800;
    color:var(--text-faint);
    text-transform:uppercase;
    letter-spacing:.3px;
    flex:none;
  }
  .amount-field input{
    flex:1;
    min-width:0;
    border:none;
    background:transparent;
    font-family:var(--font-body);
    font-weight:700;
    font-size:.83rem;
    color:var(--text);
    font-variant-numeric:tabular-nums;
    text-align:right;
    padding:1px 0;
  }
  .amount-field input:focus{outline:none;}
  .amount-field .unit{font-size:.62rem;color:var(--text-faint);flex:none;}

  .row-comment{
    display:flex;
    align-items:flex-start;
    gap:4px;
  }
  .row-comment svg{width:11px;height:11px;flex:none;margin-top:3px;color:var(--text-faint);}
  .row-comment textarea{
    flex:1;
    resize:none;
    border:none;
    background:transparent;
    font-family:var(--font-body);
    font-style:italic;
    font-size:.74rem;
    color:var(--text-soft);
    padding:1px 0;
    min-height:14px;
    line-height:1.25;
  }
  .row-comment textarea:focus{outline:none;}
  .row-comment textarea::placeholder{color:var(--text-faint);}

  .add-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    width:100%;
    padding:12px;
    border-radius:var(--radius-md);
    border:1.5px dashed var(--border);
    background:transparent;
    color:var(--primary);
    font-family:var(--font-body);
    font-weight:700;
    font-size:.88rem;
    cursor:pointer;
    transition:background .15s,border-color .15s;
  }
  .add-btn:hover{background:var(--primary-softer);border-color:var(--primary);}
  .add-btn svg{width:16px;height:16px;}

  .totals-dock{
    position:sticky;
    bottom:8px;
    display:flex;
    flex-direction:column;
    gap:10px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:14px 16px;
    box-shadow:var(--shadow);
  }
  .revenus-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .revenu-field{
    display:flex;
    flex-direction:column;
    gap:3px;
    background:var(--surface-soft);
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    padding:8px 10px;
  }
  .revenu-field label{
    font-size:.68rem;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.4px;
    color:var(--text-faint);
  }
  .revenu-field .r-inline{display:flex;align-items:baseline;gap:4px;}
  .revenu-field input{
    border:none;background:transparent;
    font-family:var(--font-display);
    font-size:1.05rem;color:var(--primary-darker);
    font-variant-numeric:tabular-nums;
    width:100%;padding:0;
  }
  .revenu-field input:focus{outline:none;}

  .stats-row{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:10px;
  }
  .stat-tile{
    text-align:center;
    padding:8px 4px;
    border-radius:var(--radius-sm);
  }
  .stat-tile .label{
    font-size:.62rem;
    font-weight:800;
    letter-spacing:.4px;
    text-transform:uppercase;
    color:var(--text-faint);
  }
  .stat-tile .value{
    font-family:var(--font-display);
    font-size:1.15rem;
    font-variant-numeric:tabular-nums;
    margin-top:2px;
  }
  .stat-tile.neutral .value{color:var(--text);}
  .stat-tile.spend .value{color:var(--primary-dark);}
  .stat-tile.good .value{color:var(--success);}
  .stat-tile.bad .value{color:var(--danger);}

  .simple-list{display:flex;flex-direction:column;gap:7px;}
  .total-banner{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--primary-soft);
    border-radius:var(--radius-md);
    padding:14px 16px;
  }
  .total-banner .t-label{font-weight:700;color:var(--primary-darker);font-size:.9rem;}
  .total-banner .t-value{
    font-family:var(--font-display);
    font-size:1.3rem;
    color:var(--primary-darker);
    font-variant-numeric:tabular-nums;
  }

  .toast{
    position:fixed;
    left:50%;
    bottom:calc(18px + env(safe-area-inset-bottom,0px));
    transform:translateX(-50%) translateY(12px);
    background:var(--text);
    color:var(--bg);
    padding:9px 18px;
    border-radius:999px;
    font-size:.82rem;
    font-weight:700;
    box-shadow:var(--shadow);
    opacity:0;
    pointer-events:none;
    transition:opacity .2s, transform .2s;
    z-index:20;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  @media (max-width:480px){
    .row-amounts{grid-template-columns:1fr 1fr;}
    .app-header h1{font-size:1.4rem;}
    .virement-person .amt{font-size:.92rem;}
    .stats-row{gap:6px;}
    .stat-tile .value{font-size:.95rem;}
  }
</style>

</div>

      {id:"p4", label:"PER / épargne enfants", mel:50, yo:0, comment:"PER Mel - projet d'arrêter les virements sur les Livrets A des enfants (25€ + 25€)"},
      {id:"p5", label:"iTunes + iCloud", mel:27, yo:0, comment:""}
    ],
    maison: [
      {id:"m1",  label:"Acquisition", montant:273165, comment:"Crédit LCL 25 ans à compter de 09/2018, garanti, frais de dossier compris - jusqu'au 05/08/2043"},
      {id:"m2",  label:"Coût du crédit maison (25 ans, 1,43%)", montant:51891, comment:"Même crédit LCL 25 ans, jusqu'au 05/08/2043"},
      {id:"m3",  label:"Frais de notaire", montant:20400, comment:"Financement 10 000€ par les parents"},
      {id:"m4",  label:"Déménagement (juillet 2018)", montant:1550, comment:""},
      {id:"m5",  label:"Cuisine (juillet 2019)", montant:11400, comment:"Prêt Franfinance Yoann 5 ans, moitié payée cash par Mel"},
      {id:"m6",  label:"Travaux cuisine (juillet 2019)", montant:3815, comment:"Prêt Franfinance Yoann 5 ans, moitié payée cash par Mel"},
      {id:"m7",  label:"Chaudière (janvier 2020)", montant:7660, comment:"Prêts parents : 7600€ (700€ le 25/07/20, 300€ en 01/21) + 5 ans à 110€/mois"},
      {id:"m8",  label:"Aménagement cave (novembre 2020)", montant:1000, comment:"Financement mèmère 800€ / Yoann 200€"},
      {id:"m9",  label:"Raccordement lave-linge + mitigeurs SDB", montant:535, comment:"Réglé en 3 fois"},
      {id:"m10", label:"Portail", montant:11492, comment:"Crédit conso 60 mois à compter de juillet 2024 (07/24 à 06/29)"},
      {id:"m11", label:"Électricien portail", montant:791, comment:"Crédit conso 60 mois à compter de juillet 2024 (07/24 à 06/29)"}
    ],
    voiture: [
      {id:"v1", label:"C5 Aircross (achat 17/06/2020)", montant:26500, comment:"Prêt LCL 7 ans dès 09/2020, sans assurance prêt - revendu à JP en 06/2023 pour 26 800€ (dont 1800€ bonus reprise)"},
      {id:"v2", label:"Peugeot 5008 (achat juin 2023)", montant:33372, comment:"Prêt LCL 7 ans dès 09/2023, sans assurance prêt - véhicule à 41 870€ après remises, 33 372€ empruntés"}
    ]
  };

  var state = null;
  var db = null;
  var writeTimer = null;
  var writeInFlight = false;
  var writePending = false;
  var localDirty = false;
  var currentTab = "charges";
  var idSeq = 1000;

  function clone(o){ return JSON.parse(JSON.stringify(o)); }
  function nextId(prefix){ idSeq += 1; return prefix + idSeq; }
  function num(v){ v = parseFloat(v); return isFinite(v) ? v : 0; }
  function euro(v){ return Math.round(num(v)); }
  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function fmtEUR(n){
    n = num(n);
    try{
      return new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(n);
    }catch(e){ return n + " €"; }
  }
  function sum(list, key){
    return list.reduce(function(a,r){ return a + num(r[key]); }, 0);
  }

  // ---------- persistence ----------

  function setSync(kind, label){
    var dot = document.getElementById("syncDot");
    var lab = document.getElementById("syncLabel");
    dot.className = "sync-dot" + (kind ? " " + kind : "");
    lab.textContent = label;
  }

  function showToast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(t._hideTimer);
    t._hideTimer = setTimeout(function(){ t.classList.remove("show"); }, 1600);
  }

  function scheduleSave(){
    // Mark local state as ahead of whatever is stored, so an incoming
    // snapshot (which can arrive shortly after connecting, or on a
    // periodic refresh) never overwrites an edit that hasn't been
    // saved yet.
    localDirty = true;
    if(!db) return;
    setSync("busy", "Enregistrement…");
    clearTimeout(writeTimer);
    writeTimer = setTimeout(doSave, 650);
  }

  function doSave(){
    if(!db) return;
    if(writeInFlight){ writePending = true; return; }
    writeInFlight = true;
    db.doc("budget/state").set(clone(state)).then(function(){
      setSync("ok", "Enregistré");
    }).catch(function(){
      setSync("err", "Non enregistré");
    }).then(function(){
      writeInFlight = false;
      if(writePending){
        writePending = false;
        doSave();
      } else {
        localDirty = false;
      }
    });
  }

  // ---------- rendering helpers ----------

  function rowCardHTML(item, section, twoAmounts){
    var amounts = twoAmounts
      ? '<div class="row-amounts">' +
          '<div class="amount-field"><span class="who">Mel</span><input type="number" step="1" inputmode="decimal" data-field="mel" value="'+num(item.mel)+'"><span class="unit">€/m</span></div>' +
          '<div class="amount-field"><span class="who">Yo</span><input type="number" step="1" inputmode="decimal" data-field="yo" value="'+num(item.yo)+'"><span class="unit">€/m</span></div>' +
        '</div>'
      : '<div class="row-amounts single">' +
          '<div class="amount-field"><span class="who">Montant</span><input type="number" step="1" inputmode="decimal" data-field="montant" value="'+num(item.montant)+'"><span class="unit">€</span></div>' +
        '</div>';
    return (
      '<div class="row-card" data-id="'+item.id+'" data-section="'+section+'">' +
        '<div class="row-top">' +
          '<input class="row-label" data-field="label" value="'+esc(item.label)+'" aria-label="Intitulé">' +
          '<button class="row-del" type="button" title="Supprimer" aria-label="Supprimer">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>' +
          '</button>' +
        '</div>' +
        amounts +
        '<div class="row-comment">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>' +
          '<textarea data-field="comment" rows="1" placeholder="Ajouter un commentaire…">'+esc(item.comment)+'</textarea>' +
        '</div>' +
      '</div>'
    );
  }

  function autoGrow(ta){
    ta.style.height = "auto";
    ta.style.height = ta.scrollHeight + "px";
  }

  // ---------- CHARGES tab ----------

  function renderCharges(){
    var el = document.getElementById("tab-charges");
    var virementMel = sum(state.commun, "mel");
    var virementYo = sum(state.commun, "yo");
    var chargesMel = virementMel + sum(state.perso, "mel");
    var chargesYo = virementYo + sum(state.perso, "yo");
    var revenusTotal = num(state.revenuMel) + num(state.revenuYo);
    var chargesTotal = chargesMel + chargesYo;
    var reste = revenusTotal - chargesTotal;

    el.innerHTML =
      '<h2 class="section-title">Charges mensuelles</h2>' +
      '<div class="virement-card">' +
        '<p class="virement-note">Virement sur le compte joint en début de mois (calculé à partir des charges communes ci-dessous)</p>' +
        '<div class="virement-people">' +
          '<div class="virement-person"><div class="who">Mel</div><div class="amt" id="virementMel"></div></div>' +
          '<div class="virement-person"><div class="who">Yo</div><div class="amt" id="virementYo"></div></div>' +
        '</div>' +
        '<div class="virement-total">Total : <b id="virementTotal"></b></div>' +
      '</div>' +
      '<p class="helper-note">Montants de Mel et Yo modifiables, commentaire libre pour chaque ligne.</p>' +
      '<div class="group">' +
        '<div class="group-head"><span class="group-pill">Commun</span><span class="group-desc">compte pour le virement compte joint</span></div>' +
        '<div class="simple-list" id="communList"></div>' +
        '<button class="add-btn" type="button" data-add="commun">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>' +
          'Ajouter une charge commune' +
        '</button>' +
      '</div>' +
      '<div class="group">' +
        '<div class="group-head"><span class="group-pill">Perso</span><span class="group-desc">reste sur le compte de chacun</span></div>' +
        '<div class="simple-list" id="persoList"></div>' +
        '<button class="add-btn" type="button" data-add="perso">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>' +
          'Ajouter une charge perso' +
        '</button>' +
      '</div>' +
      '<div class="totals-dock">' +
        '<div class="revenus-row">' +
          '<div class="revenu-field"><label>Revenus Mel</label><div class="r-inline"><input type="number" step="1" id="revenuMel" value="'+num(state.revenuMel)+'"><span>€</span></div></div>' +
          '<div class="revenu-field"><label>Revenus Yo</label><div class="r-inline"><input type="number" step="1" id="revenuYo" value="'+num(state.revenuYo)+'"><span>€</span></div></div>' +
        '</div>' +
        '<div class="stats-row">' +
          '<div class="stat-tile neutral"><div class="label">Revenus nets</div><div class="value" id="statRevenus"></div></div>' +
          '<div class="stat-tile spend"><div class="label">Charges</div><div class="value" id="statCharges"></div></div>' +
          '<div class="stat-tile '+(reste>=0?"good":"bad")+'"><div class="label">Reste à vivre</div><div class="value" id="statReste"></div></div>' +
        '</div>' +
      '</div>';

    document.getElementById("communList").innerHTML = state.commun.map(function(it){ return rowCardHTML(it,"commun",true); }).join("");
    document.getElementById("persoList").innerHTML = state.perso.map(function(it){ return rowCardHTML(it,"perso",true); }).join("");

    updateChargesTotals();

    el.querySelectorAll(".row-comment textarea").forEach(autoGrow);
    wireFieldsIn(el);
  }

  function updateChargesTotals(){
    var virementMel = sum(state.commun, "mel");
    var virementYo = sum(state.commun, "yo");
    var chargesMel = virementMel + sum(state.perso, "mel");
    var chargesYo = virementYo + sum(state.perso, "yo");
    var revenusTotal = num(state.revenuMel) + num(state.revenuYo);
    var chargesTotal = chargesMel + chargesYo;
    var reste = revenusTotal - chargesTotal;

    var vm = document.getElementById("virementMel");
    var vy = document.getElementById("virementYo");
    var vt = document.getElementById("virementTotal");
    if(vm){
      vm.textContent = fmtEUR(virementMel);
      vy.textContent = fmtEUR(virementYo);
      vt.textContent = fmtEUR(virementMel + virementYo);
    }
    var sr = document.getElementById("statRevenus");
    var sc = document.getElementById("statCharges");
    var sre = document.getElementById("statReste");
    if(sr){
      sr.textContent = fmtEUR(revenusTotal);
      sc.textContent = fmtEUR(chargesTotal);
      sre.textContent = fmtEUR(reste);
      var tile = sre.closest(".stat-tile");
      tile.classList.remove("good","bad");
      tile.classList.add(reste >= 0 ? "good" : "bad");
    }
  }

  // ---------- MAISON / VOITURE tabs ----------

  function renderSimpleTab(tabId, sectionKey, heading, addLabel, totalLabel, withHouseTitle){
    var el = document.getElementById(tabId);
    var total = sum(state[sectionKey], "montant");
    el.innerHTML =
      '<h2 class="section-title">'+heading+'</h2>' +
      (withHouseTitle ? '<input class="house-title-input" id="houseTitleInput" value="'+esc(state.houseTitle)+'" aria-label="Adresse">' : '') +
      '<div class="simple-list" id="'+sectionKey+'List"></div>' +
      '<button class="add-btn" type="button" data-add="'+sectionKey+'">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>' +
        addLabel +
      '</button>' +
      '<div class="total-banner"><span class="t-label">'+totalLabel+'</span><span class="t-value" id="'+sectionKey+'Total">'+fmtEUR(total)+'</span></div>';

    document.getElementById(sectionKey+"List").innerHTML =
      state[sectionKey].map(function(it){ return rowCardHTML(it, sectionKey, false); }).join("");

    el.querySelectorAll(".row-comment textarea").forEach(autoGrow);
    wireFieldsIn(el);
  }

  function renderMaison(){
    renderSimpleTab("tab-maison","maison","Maison","Ajouter une dépense","Total investi dans la maison", true);
  }
  function renderVoiture(){
    renderSimpleTab("tab-voiture","voiture","Voiture","Ajouter un véhicule","Total véhicules", false);
  }

  function updateSimpleTotal(sectionKey){
    var t = document.getElementById(sectionKey+"Total");
    if(t) t.textContent = fmtEUR(sum(state[sectionKey], "montant"));
  }

  function renderAll(){
    renderCharges();
    renderMaison();
    renderVoiture();
  }

  // ---------- events ----------

  function findItem(section, id){
    var list = state[section];
    for(var i=0;i<list.length;i++){ if(list[i].id === id) return list[i]; }
    return null;
  }
  function removeItem(section, id){
    state[section] = state[section].filter(function(it){ return it.id !== id; });
  }

  // Shared by every event that can carry a field's new value. Number
  // inputs are inconsistent about which event they fire for a click on
  // their native up/down spinner (some deliver "change" only, with no
  // "input"), so this same logic is wired to BOTH events below rather
  // than relying on just one - re-running it twice for the same edit is
  // harmless since it only recomputes from the field's current value.
  function handleFieldEvent(t){
    if(t.id === "revenuMel" || t.id === "revenuYo"){
      state[t.id === "revenuMel" ? "revenuMel" : "revenuYo"] = euro(t.value);
      updateChargesTotals();
      scheduleSave();
      return;
    }
    if(t.id === "houseTitleInput"){
      state.houseTitle = t.value;
      scheduleSave();
      return;
    }

    var card = t.closest(".row-card");
    if(!card) return;
    var section = card.getAttribute("data-section");
    var id = card.getAttribute("data-id");
    var item = findItem(section, id);
    if(!item) return;
    var field = t.getAttribute("data-field");
    if(!field) return;

    if(field === "label" || field === "comment"){
      item[field] = t.value;
      if(field === "comment") autoGrow(t);
    } else {
      item[field] = euro(t.value);
      if(section === "commun" || section === "perso"){
        updateChargesTotals();
      } else {
        updateSimpleTotal(section);
      }
    }
    scheduleSave();
  }

  function addRow(section){
    var item;
    if(section === "commun" || section === "perso"){
      item = {id:nextId(section[0]), label:"Nouvelle charge", mel:0, yo:0, comment:""};
    } else {
      item = {id:nextId(section[0]), label: section === "maison" ? "Nouvelle dépense" : "Nouveau véhicule", montant:0, comment:""};
    }
    state[section].push(item);
    if(section === "commun" || section === "perso"){ renderCharges(); }
    else if(section === "maison"){ renderMaison(); }
    else { renderVoiture(); }
    var newCard = document.querySelector('.row-card[data-id="'+item.id+'"] .row-label');
    if(newCard){ newCard.focus(); newCard.select(); }
    scheduleSave();
  }

  function deleteRow(section, id){
    removeItem(section, id);
    if(section === "commun" || section === "perso"){ renderCharges(); }
    else if(section === "maison"){ renderMaison(); }
    else { renderVoiture(); }
    scheduleSave();
  }

  // Belt and suspenders on visibility too: the "hidden" attribute is set
  // (the platform's own recommended way to hide a panel), AND an inline
  // "display:none/flex !important" is written directly on the element.
  // An inline !important style outranks essentially anything a
  // stylesheet, an extension, or a host page could throw at it, so the
  // three panels can never all end up visible together.
  function applyTabVisibility(tab){
    var panels = {
      charges: document.getElementById("tab-charges"),
      maison: document.getElementById("tab-maison"),
      voiture: document.getElementById("tab-voiture")
    };
    Object.keys(panels).forEach(function(key){
      var el = panels[key];
      if(!el) return;
      if(key === tab){
        el.hidden = false;
        el.style.cssText = "display:flex !important;";
      } else {
        el.hidden = true;
        el.style.cssText = "display:none !important;";
      }
    });
  }

  function switchTab(tab){
    currentTab = tab;
    document.querySelectorAll(".tab-btn").forEach(function(b){
      b.classList.toggle("active", b.getAttribute("data-tab") === tab);
    });
    applyTabVisibility(tab);
  }

  // Bind directly on every interactive element inside a freshly rendered
  // container (fields AND its add/delete buttons), rather than relying
  // only on a listener on `document` that the click/input has to bubble
  // all the way up to. A direct listener on the element itself cannot be
  // missed by any delegation quirk (focus changes, an ancestor handling
  // the event first, etc.), which is what caused totals to look "stuck"
  // before. Each button/field is only ever wired once, right after it is
  // created, so nothing fires twice.
  function wireFieldsIn(container){
    if(!container) return;
    container.querySelectorAll("input, textarea").forEach(function(el){
      el.addEventListener("input", function(){ handleFieldEvent(el); });
      el.addEventListener("change", function(){ handleFieldEvent(el); });
      if(el.tagName === "INPUT" && el.type === "number"){
        // Extra safety net: a click on the native spinner arrows doesn't
        // always dispatch input/change synchronously in every environment.
        el.addEventListener("click", function(){ setTimeout(function(){ handleFieldEvent(el); }, 0); });
      }
    });
    container.querySelectorAll("[data-add]").forEach(function(btn){
      btn.addEventListener("click", function(){ addRow(btn.getAttribute("data-add")); });
    });
    container.querySelectorAll(".row-del").forEach(function(btn){
      btn.addEventListener("click", function(){
        var card = btn.closest(".row-card");
        deleteRow(card.getAttribute("data-section"), card.getAttribute("data-id"));
      });
    });
  }

  // The three tab buttons are part of the static shell (never
  // re-rendered), so they're wired once, directly, here.
  document.querySelectorAll(".tab-btn").forEach(function(b){
    b.addEventListener("click", function(){ switchTab(b.getAttribute("data-tab")); });
  });

  // ---------- boot ----------

  state = clone(DEFAULT_STATE);
  renderAll();
  applyTabVisibility("charges");
  setSync("", "Hors ligne");

  // Deliberately a ONE-TIME load, not a live subscription: once the page
  // has state (local defaults or whatever was stored), nothing but the
  // person typing is ever allowed to change it again. This is what
  // guarantees an edit always sticks and every total updates instantly,
  // with no risk of a background sync silently reverting it.
  (function connect(){
    if(!(window.claude && window.claude.use)){ setSync("", "Mode local"); return; }
    window.claude.use("db").then(function(ns){
      db = ns;
      if(!db){ setSync("", "Mode local"); return; }
      return db.doc("budget/state").get().then(function(snap){
        if(localDirty) return; // the person already started editing before this resolved
        if(snap.exists){
          state = snap.data();
          renderAll();
          applyTabVisibility(currentTab);
          setSync("ok", "Enregistré");
        } else {
          setSync("ok", "Enregistré");
          return db.doc("budget/state").set(clone(state));
        }
      });
    }).catch(function(){ setSync("", "Mode local"); });
  })();

})();
</script>
